[workspace]

resolver = "2"
members = [
  "shared",
  "extractors/ebpf",
  "extractors/rpc",
  "extractors/p2p",
  "extractors/log",
  "extractors/ipc",
  "tools/logger",
  "tools/websocket",
  "tools/metrics",
  "tools/connectivity-check",
  "tools/archive",
  "tools/alerts",
]

# The fuzz crate is a standalone workspace (see fuzz/README.md) so that the
# libFuzzer runtime is not built or tested together with the main workspace.
exclude = ["fuzz"]
