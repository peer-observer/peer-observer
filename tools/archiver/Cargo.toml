[package]
name = "archiver"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/archiver/lib.rs"

[dependencies]
shared = { path = "../../shared" }
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.8"
sha2 = "0.10"

[dev-dependencies]
replayer = { path = "../replayer" }

[features]
# Treat warnings as a build error.
strict = []
# Run integration tests needing a NATS server.
nats_integration_tests = []
