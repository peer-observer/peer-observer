[package]
name = "shared"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
prost = "0.14.1"
bitcoin = "0.32"
base32 = "0.5.1" # for encoding Tor/Onion addresses
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive"] }
simple_logger = "5.2.0"
log = "0.4"
async-nats = { version = "0.51.0", default-features = false }
prometheus = "0.14.0"
lazy_static = "1.5.0"
tokio = { version = "1.51.0", features = ["rt-multi-thread", "process", "signal", "test-util"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
futures = "0.3.31"
rand = "0.10.1"
time = { version = "0.3.47", features = ["parsing"] }
regex = "1.12"
anyhow = "1.0.102"
zstd = "0.14"

# When updating the Bitcoin Core version used, grep for CORE_VERSION_GREP
# and update the corepc_regtest_client::types::v* to the new version.
bitcoind = { version = "0.43.2", features = ["download", "31_0"] }
corepc-regtest-client = { version = "0.18.0" }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
hex = "0.4"

[features]
# Treat warnings as a build error.
strict = []

# Run integration tests needing a NATS server.
nats_integration_tests = []
